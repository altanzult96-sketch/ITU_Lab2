<!-- HTML5 ашиглаж байгааг зарлана -->
<!DOCTYPE html>
<!-- Вебийн үндсэн хэл Монгол -->
<html lang="mn">
    <!-- Тохиргоо, metadata -->
    <head>
        <!-- Мета элемент нь HTML баримтын талаарх нэмэлт мэдээллийг агуулдаг. 
            name атрибут нь мета мэдээллийн төрлийг зааж, 
            content атрибут нь тухайн мэдээллийн утгыг заана.
            Зарим мета мэдээллийг хайлтын системүүд ашиглаж болно.-->
        <!-- Монгол зэрэг тэмдэгтүүдийг зөв харуулна -->
        <meta charset="UTF-8">
        <!-- Гар утас, компьютерийн дэлгэцэнд тохируулна -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Миний танилцуулга</title>
    </head>

    <body>

        </header>

        <!-- Navigation буюу хуудас хооронд шилжих цэс -->
        <nav>
            <!-- вебийн navigation-ийн холбоосууд -->
            <a href="index.html">Нүүр</a> <br>
            <a href="about.html">Миний тухай</a> <br>
            <a href="interests.html">Миний сонирхол</a> <br>

            <a href="contact.html">Холбоо барих</a>
        </nav>

        <!-- Тухайн веб хуудасны хамгийн гол үндсэн агуулга -->
        <main>
            <!-- Нэг тодорхой сэдэвтэй агуулгын хэсэг -->
            <!-- Нэг сэдвийн агуулгыг бүлэглэнэ -->
            <section>

                    Би МУИС-ийн МТЭС-ийн МКУТ-д Программ хангамж хөтөлбөрөөр суралцдаг. <br>
                    Одоо 3-р түвшний оюутан.

                <img src="images/profile.jpg" alt="Миний танилцуулгын зураг" width="300">

        <!-- Доод хэсэг -->
        <!-- энд: зохиогч, он, copyright -->
        <footer>
            <p>&copy; 2026 Te Zulaa</p>
        </footer>

</html>
