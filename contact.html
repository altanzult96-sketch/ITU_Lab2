        <header>

        <nav>
            <a href="index.html">Нүүр</a> <br>
            <a href="about.html">Миний тухай</a> <br>

        </nav>

        <main>
            <section>
                <h2>Надтай холбоо барих</h2>
                <p>Доорх маягтыг ашиглан санал, хүсэлтээ илгээж болно.</p>

                <!--action - хаашаа илгээх-->
                <!--method - ямар аргаар илгээх-->
                <!--GET - URL-ээр-->
                <!--POST - request body-оор-->
                <!--FormSubmit бол HTML form-оос ирсэн мэдээллийг хүлээж аваад, email рүү дамжуулж өгдөг онлайн үйлчилгээ-->
                <form action="https://formsubmit.co/altanzult96@gmail.com" method="POST">
                    <input type="hidden" name="_subject" value="Миний танилцуулга вэб сайтаас шинэ зурвас ирлээ!">
                    <p>
                        <label for="name">Нэр:</label><br>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </p>

                    <p>
                        <label for="email">Цахим шуудан:</label><br>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                    </p>

                    <!--input = 1 мөрийн олон төрлийн оролттой элемент-->
                    <!--textarea = олон мөрийн текст оруулах зориулалттай элемент-->
                    <p>
                        <label for="message">Зурвас:</label><br>
                        <textarea id="message" name="message" rows="5" cols="40" placeholder="Your message" required></textarea>
                    </p>

                    <button type="submit">Илгээх</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Te Zulaa</p>
        </footer>
    </body>
